[pytest]
markers =
    chaos: Chaos engineering experiments (slow, destructive)
    slow: Tests that take >30 seconds

testpaths = tests/chaos
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers

# Default: skip chaos tests unless explicitly requested
# Run with: pytest -m chaos
